<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Counter!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="content">
        <h1>Color List</h1>
        <!-- CHANGED: Changed div to ul for valid li child elements -->
        <ul id="color-list"></ul>
    </div>

    <script>
        async function loadJSONData() {
            try {
                const response = await fetch('colors.json');
                const colors = await response.json();
                const listContainer = document.getElementById('color-list');

                // Clear any existing content inside the container
                listContainer.innerHTML = '';

                colors.forEach(color => {
                    const listItem = document.createElement('li');
                    
                    listItem.innerHTML = `
                        <div class='color-list-item'>
                            <div class='color-swatch' style='background-color: ${color["Hex (RGB)"]};'></div>
                            <div>${color["Name"]} - ${color["Hex (RGB)"]}</div>
                        </div>
                    `;
                    listContainer.appendChild(listItem);
                });
            } catch (error) {
                console.error("Error loading the JSON file:", error);
                const listContainer = document.getElementById('color-list');
                listContainer.innerHTML = "<li>Failed to load colors. Please try again later.</li>";
            }
        }

        loadJSONData();
    </script>
</body>
</html>

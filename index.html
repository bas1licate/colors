<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Counter!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
        <a class="navbar-brand" href="https://github.com/contrastquota/colors">
            <img src="pfp.png" width="30" height="30" class="d-inline-block align-top" alt="illustration of Namsan tower in Seoul, South Korea">
            <span class="font-weight-light text-muted">github</span>
        </a>
        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
        <li class="nav-item active">
             
        </li>
        <li class="nav-item">
             
        </li>
        <li class="nav-item">
             
        </li>
        </ul>
        <a href="https://nameawoman.co.uk/">Based on Name 100 Women</a>
    </div>
    </nav>

    <div class="content">
        <h1 style="text-align: center;">Color Counter</h1>
        <p>Try to name as many colors as you can! Be sure to enter the <em>full</em> name (e.g. "Kelly Green"):</p>
        
        <p>Colors Found: <span id="counter">0</span></p>
        
        <div class="form-group">
            <form id="color-form">
                <input class="form-control" type="text" id="color-input" name="color-input" required autofocus placeholder="Enter a color name...">
                <button type="submit" hidden>Add Color</button>
                <p class="feedback"></p>
            </form>
        </div>
        <ul id="color-list"></ul>
    </div>


    <script>
        let colorsGlobal = [];
        const userFoundColors = new Set(); 

        // Fetch the external JSON color database
        async function loadJSONData() {
            try {
                const response = await fetch('colors.json');
                colorsGlobal = await response.json();
            } catch (error) {
                console.error("Error loading the JSON file:", error);
            }
        }

        loadJSONData();

        // show the list of found colors in alphabetical order
        function displayFoundColors() {
            const listContainer = document.getElementById('color-list');
            listContainer.innerHTML = ''; // Clear existing list

            // Convert Set to Array and sort alphabetically
            const sortedColors = Array.from(userFoundColors).sort();

            sortedColors.forEach(colorName => {
                const foundColor = colorsGlobal.find(color => color["Name"].toLowerCase() === colorName);
                if (foundColor) {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <div class='color-list-item'>
                            <div class='color-swatch' style='background-color: ${foundColor["Hex (RGB)"]};'></div>
                            <div>${foundColor["Name"]} - ${foundColor["Hex (RGB)"]}</div>
                        </div>
                    `;
                    listContainer.appendChild(listItem);
                }
            });
        }

        // Handle form interactions
        document.getElementById('color-form').addEventListener("submit", (event) => {
            event.preventDefault();
            
            const colorInput = document.getElementById('color-input');
            const feedbackEl = document.querySelector('.feedback');
            const listContainer = document.getElementById('color-list');
            const counterEl = document.getElementById('counter');
            
            const colorName = colorInput.value.trim().toLowerCase();
            
            // Clear old feedback states at the start of a submission
            feedbackEl.textContent = "";

            if (!colorName) return;

            // Check if user already inputted this color
            if (userFoundColors.has(colorName)) {
                feedbackEl.textContent = "You already found this color!";
                colorInput.value = '';
                return;
            }

            // Look up the matching entry in the global color database
            // lowercase comparison for case-insensitive matching
            const foundColor = colorsGlobal.find(color => color["Name"].toLowerCase() === colorName);

            if (foundColor) {
                // Log verified color matching user metadata
                userFoundColors.add(colorName);
                
                // Construct the list item for the found color and append it to the list
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <div class='color-list-item'>
                        <div class='color-swatch' style='background-color: ${foundColor["Hex (RGB)"]};'></div>
                        <div>${foundColor["Name"]} - ${foundColor["Hex (RGB)"]}</div>
                    </div>
                `;
                
                // Update tracker data counters
                counterEl.textContent = userFoundColors.size;

                // display found colors
                displayFoundColors();
                
                // Clear input form field for seamless typing loops
                colorInput.value = '';
            } else {
                feedbackEl.textContent = "Color not found.";
                colorInput.value = '';
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>

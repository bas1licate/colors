<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Counter!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01" style="display: flex; justify-content: space-between; align-items: center;">
        <a class="navbar-brand" href="https://github.com/contrastquota/colors">
            <img src="pfp.png" width="30" height="30" class="d-inline-block align-top" alt="illustration of Namsan tower in Seoul, South Korea">
            <span class="font-weight-light text-muted">github</span>
        </a>
        
        <a href="https://nameawoman.co.uk/">Based on Name 100 Women</a>
    </div>
    </nav>

    <div class="content">
        <h1 style="text-align: center;">Color Counter</h1>
        <p>Try to name as many colors as you can! Be sure to enter the <em>full</em> name (e.g. "Kelly Green").</p>
        
        <p>Colors Found: <span id="counter" class="badge badge-primary">0</span></p>
        
        <div class="form-group">
            <form id="color-form">
                <input class="form-control" type="text" id="color-input" name="color-input" required autofocus placeholder="Enter a color name...">
                <button type="submit" hidden>Add Color</button>
                <p class="feedback"></p>
            </form>
        </div>
        <ul id="color-list"></ul>
    </div>

    <div class="modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
            <div class="modal-body">
                <h5>Congrats! You reached 100 Colors!</h5>
                <p>Honestly, I don't know how you got here.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="results btn btn-primary" data-dismiss="modal">View Results</button>
                <button type="button" class="continue btn btn-secondary" data-dismiss="modal">Continue</button>
            </div>
            </div>
        </div>
    </div>

    <script>

        let colorsGlobal = [];
        // Store searchKey strings to reliably unique finds
        const userFoundColors = new Set(); 

        async function loadJSONData() {
            try {
                const response = await fetch('./colors.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status} (${response.statusText})`);
                }

                colorsGlobal = await response.json();
                console.log(`Successfully loaded ${colorsGlobal.length} colors.`);
            } catch (error) {
                console.error("Error loading the JSON file:", error);
                
                // Show visible error on screen for testing
                const feedbackEl = document.querySelector('.feedback');
                if (feedbackEl) {
                    feedbackEl.textContent = `Failed to load color database: ${error.message}`;
                    feedbackEl.style.color = "red";
                }
            }
        }

        loadJSONData();

        // Utility function to convert raw input to the searchKey format
        function normalizeInput(input) {
            return input.split('(')[0].trim().toLowerCase().replace(/[\s\-_/']+/g, '');
        }

        // Render the list of found colors in alphabetical order
        function displayFoundColors() {
            const listContainer = document.getElementById('color-list');
            listContainer.innerHTML = '';

            // Retrieve matched objects from global array and sort by official Name
            const foundObjects = Array.from(userFoundColors)
                .map(key => colorsGlobal.find(c => c.searchKey === key))
                .filter(Boolean)
                .sort((a, b) => a.Name.localeCompare(b.Name));

            foundObjects.forEach(color => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <div class='color-list-item'>
                        <div class='color-swatch' style='background-color: ${color["Hex (RGB)"]};'></div>
                        <div>${color["Name"]} - ${color["Hex (RGB)"]}</div>
                    </div>
                `;
                listContainer.appendChild(listItem);
            });
        }

        // Form submit handler
        document.getElementById('color-form').addEventListener("submit", (event) => {
            event.preventDefault();
            
            const colorInput = document.getElementById('color-input');
            const feedbackEl = document.querySelector('.feedback');
            const counterEl = document.getElementById('counter');
            
            const rawInput = colorInput.value;
            const searchKey = normalizeInput(rawInput);
            
            feedbackEl.textContent = "";

            if (!searchKey) return;

            // Check if user already found this color 
            if (userFoundColors.has(searchKey)) {
                colorInput.classList.add('border', 'border-danger');
                feedbackEl.textContent = "You already found this color!";
                colorInput.value = '';
                return;
            }

            // Look up matching entry by searchKey
            const foundColor = colorsGlobal.find(color => color["searchKey"] === searchKey);

            if (foundColor) {
                // Save key to prevent future duplicates 
                userFoundColors.add(searchKey);
                
                // Visual feedback 
                colorInput.classList.remove('border', 'border-danger');
                counterEl.textContent = userFoundColors.size;

                displayFoundColors();
                colorInput.value = '';
            } else {
                colorInput.classList.add('border', 'border-danger');
                feedbackEl.textContent = "Color not found.";
                colorInput.value = '';
            }

            // feedback when user gets to 50 colors
            if (userFoundColors.size === 50) {
                $('.modal').modal('show');

                // User chooses to view results, locks the input field
                $('.results').on('click', function() {
                    $('.form-control').prop('disabled', true);
                });

                // User chooses to continue to name as many colors as they can
                $('.continue').on('click', function() {
                    $('.form-control').prop('disabled', false);
                });
            }


        });
    </script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>

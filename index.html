<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Counter!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="content">
        <h1>Color List (<span id="counter">0</span> Found)</h1>
        <form id="color-form">
            <label for="color-input">Enter a color name:</label>
            <input type="text" id="color-input" name="color-input" required autofocus>
            <button type="submit" hidden>Add Color</button>
            <p class="feedback"></p>
        </form>
        <ul id="color-list"></ul>
    </div>

    <script>
        let colorsGlobal = [];
        const userFoundColors = new Set(); 

        // Fetch the external JSON color database
        async function loadJSONData() {
            try {
                const response = await fetch('colors.json');
                colorsGlobal = await response.json();
            } catch (error) {
                console.error("Error loading the JSON file:", error);
            }
        }

        loadJSONData();

        // show the list of found colors in alphabetical order
        function displayFoundColors() {
            const listContainer = document.getElementById('color-list');
            listContainer.innerHTML = ''; // Clear existing list

            // Convert Set to Array and sort alphabetically
            const sortedColors = Array.from(userFoundColors).sort();

            sortedColors.forEach(colorName => {
                const foundColor = colorsGlobal.find(color => color["Name"].toLowerCase() === colorName);
                if (foundColor) {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <div class='color-list-item'>
                            <div class='color-swatch' style='background-color: ${foundColor["Hex (RGB)"]};'></div>
                            <div>${foundColor["Name"]} - ${foundColor["Hex (RGB)"]}</div>
                        </div>
                    `;
                    listContainer.appendChild(listItem);
                }
            });
        }

        // Handle form interactions
        document.getElementById('color-form').addEventListener("submit", (event) => {
            event.preventDefault();
            
            const colorInput = document.getElementById('color-input');
            const feedbackEl = document.querySelector('.feedback');
            const listContainer = document.getElementById('color-list');
            const counterEl = document.getElementById('counter');
            
            const colorName = colorInput.value.trim().toLowerCase();
            
            // Clear old feedback states at the start of a submission
            feedbackEl.textContent = "";

            if (!colorName) return;

            // Check if user already inputted this color
            if (userFoundColors.has(colorName)) {
                feedbackEl.textContent = "You already found this color!";
                colorInput.value = '';
                return;
            }

            // Look up the matching entry in the global color database
            // lowercase comparison for case-insensitive matching
            const foundColor = colorsGlobal.find(color => color["Name"].toLowerCase() === colorName);

            if (foundColor) {
                // Log verified color matching user metadata
                userFoundColors.add(colorName);
                
                // Construct the list item for the found color and append it to the list
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <div class='color-list-item'>
                        <div class='color-swatch' style='background-color: ${foundColor["Hex (RGB)"]};'></div>
                        <div>${foundColor["Name"]} - ${foundColor["Hex (RGB)"]}</div>
                    </div>
                `;
                
                // Update tracker data counters
                counterEl.textContent = userFoundColors.size;

                // display found colors
                displayFoundColors();
                
                // Clear input form field for seamless typing loops
                colorInput.value = '';
            } else {
                feedbackEl.textContent = "Color not found.";
                colorInput.value = '';
            }
        });
    </script>
</body>
</html>
